name: Vigia Ecowitt huerta

# Vigila que el gateway Ecowitt de la huerta siga reportando.
# Es la SEGUNDA capa: la primera es el workflow n8n "Huerta - Alertas Telegram"
# (2C2z3jDdH4kyo95o), que avisa cada 5 min. Este vigia existe para el caso en que
# esa primera capa este apagada o n8n se caiga entero: en abril de 2026 el gateway
# estuvo 14 dias caido sin que nadie se enterara, justo por eso.
#
# Corre en GitHub, no en n8n ni en la nube de Claude, asi que es independiente de ambos.
# Solo avisa por Telegram cuando CAMBIA el estado (cae o se recupera), para no repetir
# el mismo mensaje cada media hora.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: vigia-ecowitt
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar el estado del gateway
        id: check
        env:
          URL: ${{ secrets.ECOWITT_STATUS_URL }}
          UMBRAL_MIN: '60'
        run: |
          set -uo pipefail
          if [ -z "${URL:-}" ]; then
            echo "estado=NO_PUDE_CONSULTAR"                        >> "$GITHUB_OUTPUT"
            echo "detalle=Falta el secreto ECOWITT_STATUS_URL"     >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HTTP=$(curl -sS -m 30 -o /tmp/body.json -w '%{http_code}' "$URL" 2>/tmp/err.txt) || HTTP=000
          if [ "$HTTP" != "200" ]; then
            ERR=$(tr -d '\n' < /tmp/err.txt | head -c 180)
            echo "estado=NO_PUDE_CONSULTAR"                        >> "$GITHUB_OUTPUT"
            echo "detalle=HTTP $HTTP ${ERR}"                       >> "$GITHUB_OUTPUT"
            exit 0
          fi

          J=$(jq -c 'if type=="array" then .[0] else . end' /tmp/body.json 2>/dev/null) || J=""
          if [ -z "$J" ] || [ "$J" = "null" ]; then
            echo "estado=NO_PUDE_CONSULTAR"                        >> "$GITHUB_OUTPUT"
            echo "detalle=Respuesta no es JSON valido"             >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ST=$(printf '%s' "$J"  | jq -r '.device_status // "desconocido"')
          AGE=$(printf '%s' "$J" | jq -r '.age_min // empty')
          LAST=$(printf '%s' "$J"| jq -r '.last_update_iso // "?"')
          SUELO=$(printf '%s' "$J" | jq -r '"Cama3=\(.soil_ch1 // "?")% Cama1=\(.soil_ch2 // "?")% Cama4=\(.soil_ch3 // "?")% Invernadero=\(.soil_ch4 // "?")% Cama2=\(.soil_ch5 // "?")%"')

          echo "detalle=status=$ST age_min=${AGE:-?} ultimo=$LAST | $SUELO" >> "$GITHUB_OUTPUT"

          if [ -z "${AGE:-}" ] || ! printf '%s' "$AGE" | grep -Eq '^[0-9]+$'; then
            echo "estado=CAIDO" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$ST" != "Online" ] || [ "$AGE" -gt "$UMBRAL_MIN" ]; then
            echo "estado=CAIDO" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "estado=OK" >> "$GITHUB_OUTPUT"

      - name: Ver como acabo la vez anterior
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          C=$(gh api "repos/${{ github.repository }}/actions/workflows/vigia-ecowitt.yml/runs?status=completed&per_page=1" \
                --jq '.workflow_runs[0].conclusion' 2>/dev/null) || C=""
          echo "anterior=${C:-desconocido}" >> "$GITHUB_OUTPUT"

      - name: Avisar por Telegram si cambio el estado
        env:
          TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT:   ${{ secrets.TELEGRAM_CHAT_ID }}
          ESTADO: ${{ steps.check.outputs.estado }}
          DETALLE: ${{ steps.check.outputs.detalle }}
          ANTERIOR: ${{ steps.prev.outputs.anterior }}
        run: |
          set -uo pipefail
          [ -z "${TOKEN:-}" ] && { echo "sin TELEGRAM_BOT_TOKEN, no aviso"; exit 0; }

          MSG=""
          if [ "$ESTADO" = "OK" ] && [ "$ANTERIOR" = "failure" ]; then
            MSG="Huerta recuperada: el gateway Ecowitt vuelve a reportar.%0A${DETALLE}"
          elif [ "$ESTADO" = "CAIDO" ] && [ "$ANTERIOR" != "failure" ]; then
            MSG="ALERTA huerta: el gateway Ecowitt NO esta reportando.%0A${DETALLE}%0A%0ARevisar baterias del GW1100B (MAC 8C:4F:00:4F:C1:E6) y que el workflow n8n 'Huerta - Alertas Telegram' siga activo. En abril de 2026 una caida asi paso 14 dias inadvertida."
          elif [ "$ESTADO" = "NO_PUDE_CONSULTAR" ] && [ "$ANTERIOR" != "failure" ]; then
            MSG="Aviso: el vigia NO pudo consultar el estado del Ecowitt.%0A${DETALLE}%0A%0AEsto NO significa que el gateway este caido, sino que no se pudo comprobar. Verificar a mano antes de ir a la finca."
          fi

          if [ -n "$MSG" ]; then
            curl -sS -m 20 -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -d "chat_id=${CHAT}" --data-urlencode "text=$(printf '%b' "${MSG//%0A/\n}")" \
              -o /dev/null -w 'telegram HTTP %{http_code}\n' || echo "fallo el envio a Telegram"
          else
            echo "sin cambio de estado (actual=$ESTADO, anterior=$ANTERIOR): no se avisa"
          fi

      - name: Resultado
        run: |
          echo "Estado: ${{ steps.check.outputs.estado }}"
          echo "Detalle: ${{ steps.check.outputs.detalle }}"
          case "${{ steps.check.outputs.estado }}" in
            OK) echo "Ecowitt reportando con normalidad." ;;
            *)  echo "::error::${{ steps.check.outputs.estado }} - ${{ steps.check.outputs.detalle }}"; exit 1 ;;
          esac
